# For full documentation of the configuration options please
# see: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  # timeout for analysis, e.g. 30s, 5m, default is 0 (no timeout)
  timeout: 5m

  # exit code when at least one issue was found, default is 1
  issues-exit-code: 1

  # include test files or not, default is true
  tests: true

linters:
  default: all
  disable:
    - gochecknoglobals
    - lll
    - prealloc
    - wsl
    - wsl_v5
    - godox
    - err113
    - testpackage
    - godot
    - goheader
    - noctx
    - errorlint
    - nlreturn
    - forbidigo
    - wrapcheck
    - varnamelen
    - ireturn
    - tparallel
    - paralleltest
    - makezero
    - thelper
    - cyclop
    - revive
    - importas
    - gomoddirectives
    - promlinter
    - tagliatelle
    - errname
    - grouper
    - decorder
    - maintidx
    - exhaustruct
    - asasalint
    - exhaustive
    - testifylint
    - mnd
    - depguard

  settings:
    errcheck:
      # report about not checking of errors in type assertions: `a := b.(MyStruct)`;
      # default is false: such cases aren't reported by default.
      check-type-assertions: false

      # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`;
      # default is false: such cases aren't reported by default.
      check-blank: false
    govet:
      # report about shadowed variables
      enable:
        - shadow
    gocyclo:
      # minimal code complexity to report, 30 by default (but we recommend 10-20)
      min-complexity: 15
    dupl:
      # tokens count to trigger issue, 150 by default
      threshold: 150
    goconst:
      # minimal length of string constant, 3 by default
      min-len: 3
      # minimal occurrences count to trigger, 3 by default
      min-occurrences: 3
    unparam:
      # Inspect exported functions, default is false. Set to true if no external program/library imports your code.
      check-exported: false
    nakedret:
      # make an issue if func has more lines of code than this setting and it has naked returns; default is 30
      max-func-lines: 0 # Warn on all naked returns.
    gocritic:
      # non-default checks only; default checks are always on
      # all checks list: https://github.com/go-critic/checkers
      enabled-checks:
        - boolExprSimplify
        - builtinShadow
        - commentedOutImport
        - emptyFallthrough
        - importShadow
        - indexAlloc
        - methodExprCall
        - nestingReduce
        - ptrToRefParam
        - typeUnparen
        - unnecessaryBlock
        - yodaStyleExpr

  exclusions:
    # gateway/bridgemap is trivial registration code
    paths:
      - gateway/bridgemap

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      # simplify code: gofmt with `-s` option, true by default
      simplify: true
    goimports:
      # put imports beginning with prefix after 3rd-party packages;
      # it's a comma-separated list of prefixes
      local-prefixes:
        - github.com

# rules to deal with reported issues
issues:
  # Maximum issues count per one linter. Set to 0 to disable. Default is 50.
  max-issues-per-linter: 0

  # Maximum count of issues with the same text. Set to 0 to disable. Default is 3.
  max-same-issues: 0

  # Show only new issues created after git revision `REV`.
  # CI overrides this with `--new-from-rev HEAD~5`.
  new-from-rev: HEAD~1
